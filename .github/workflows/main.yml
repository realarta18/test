name: High-Performance Enterprise Windows RDP

on:
  workflow_dispatch:

jobs:
  environment-deploy:
    runs-on: windows-latest
    steps:
      - name: Deploy AAA Enterprise RDP
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ROUTER_ZIP_URL: ${{ secrets.ROUTER_ZIP_URL }}
          ROUTER_ZIP_PASSWORD: ${{ secrets.ROUTER_ZIP_PASSWORD }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Continue'

          $E = [char]27
          $C_Reset   = "$E[0m"
          $C_Bold    = "$E[1m"
          $C_Cyan    = "$E[36;1m"
          $C_Green   = "$E[32;1m"
          $C_Yellow  = "$E[33;1m"
          $C_Red     = "$E[31;1m"
          $C_Magenta = "$E[35;1m"
          $C_Blue    = "$E[34;1m"

          function Show-Banner {
              Write-Host "$C_Cyan"
              Write-Host "=========================================================================="
              Write-Host "    _   _   _     _____ _   _ _____ _____ ____  ____  ____ ____  _____    "
              Write-Host "   / \ / \ / \   | ____| \ | |_   _| ____|  _ \|  _ \/ ___|  _ \|  _ \   "
              Write-Host "  / _ \ _ \ _ \  |  _| |  \| | | | |  _| | |_) | |_) \___ \ |_) | |_) |  "
              Write-Host " / ___ \_/ \_/   | |___| |\  | | | | |___|  _ <|  __/ ___) |  __/|  _ <   "
              Write-Host "/_/   \_\        |_____|_| \_| |_| |_____|_| \_\_|   |____/|_|   |_| \_\  "
              Write-Host "=========================================================================="
              Write-Host "               AAA ENTERPRISE AUTOMATED DEPLOYMENT ENGINE                "
              Write-Host "=========================================================================="
              Write-Host "$C_Reset"
          }

          function Log-Step ([string]$StepName, [string]$Status = "PROCESSING") {
              $Timestamp = Get-Date -Format "HH:mm:ss"
              switch ($Status) {
                  "SUCCESS" { Write-Host "$C_Bold[$Timestamp]$C_Reset $C_Green[OK]$C_Reset $StepName" }
                  "FAILED"  { Write-Host "$C_Bold[$Timestamp]$C_Reset $C_Red[FAIL]$C_Reset $StepName" }
                  "SKIP"    { Write-Host "$C_Bold[$Timestamp]$C_Reset $C_Yellow[SKIP]$C_Reset $StepName" }
                  default   { Write-Host "$C_Bold[$Timestamp]$C_Reset $C_Cyan[RUN]$C_Reset $StepName..." }
              }
          }

          function Extract-SmartArchive {
              param (
                  [string]$ArchiveFilePath,
                  [string]$DestinationPath,
                  [string]$Password
              )
              $Zip7Exe = "C:\Program Files\7-Zip\7z.exe"
              if (-not (Test-Path $ArchiveFilePath) -or -not (Test-Path $Zip7Exe)) { return }
              $WorkTempDir = Join-Path $env:TEMP "unwrap_workspace_$([guid]::NewGuid().Guid)"
              New-Item -Path $WorkTempDir -ItemType Directory -Force | Out-Null
              if (-not [string]::IsNullOrWhiteSpace($Password)) {
                  & $Zip7Exe x $ArchiveFilePath "-o$WorkTempDir" "-p$Password" -y | Out-Null
              } else {
                  & $Zip7Exe x $ArchiveFilePath "-o$WorkTempDir" -y | Out-Null
              }
              $RootPath = $WorkTempDir
              while ($true) {
                  $SubItems = Get-ChildItem -Path $RootPath
                  if ($SubItems.Count -eq 1 -and $SubItems[0].PSIsContainer) {
                      $RootPath = $SubItems[0].FullName
                  } else {
                      break
                  }
              }
              if (-not (Test-Path $DestinationPath)) { New-Item -Path $DestinationPath -ItemType Directory -Force | Out-Null }
              Get-ChildItem -Path $RootPath | Copy-Item -Destination $DestinationPath -Recurse -Force
              Remove-Item -Path $WorkTempDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          Show-Banner

          Log-Step "Configuring Windows Core Kernel and Terminal Server Parameters"
          Set-Service -Name seclogon -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name seclogon -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "LocalAccountTokenFilterPolicy" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "ConsentPromptBehaviorAdmin" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "ConsentPromptBehaviorUser" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "EnableLUA" -Value 0 -Force
          Set-Service -Name TermService -StartupType Automatic
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Inbound-3389" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -ErrorAction SilentlyContinue | Out-Null
          powercfg /change standby-timeout-ac 0
          powercfg /change standby-timeout-dc 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          powercfg /hibernate off
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Type DWord -Force
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue } catch {}
          Restart-Service -Name TermService -Force
          Log-Step "Configuring Windows Core Kernel and Terminal Server Parameters" "SUCCESS"

          Log-Step "Injecting Anthropic API Environment Secrets for Claude CLI"
          if (-not [string]::IsNullOrWhiteSpace($env:ANTHROPIC_BASE_URL)) {
              [Environment]::SetEnvironmentVariable('ANTHROPIC_BASE_URL', $env:ANTHROPIC_BASE_URL, 'User')
              [Environment]::SetEnvironmentVariable('ANTHROPIC_BASE_URL', $env:ANTHROPIC_BASE_URL, 'Machine')
              [Environment]::SetEnvironmentVariable('ANTHROPIC_BASE_URL', $env:ANTHROPIC_BASE_URL, 'Process')
          }
          if (-not [string]::IsNullOrWhiteSpace($env:ANTHROPIC_AUTH_TOKEN)) {
              [Environment]::SetEnvironmentVariable('ANTHROPIC_AUTH_TOKEN', $env:ANTHROPIC_AUTH_TOKEN, 'User')
              [Environment]::SetEnvironmentVariable('ANTHROPIC_AUTH_TOKEN', $env:ANTHROPIC_AUTH_TOKEN, 'Machine')
              [Environment]::SetEnvironmentVariable('ANTHROPIC_AUTH_TOKEN', $env:ANTHROPIC_AUTH_TOKEN, 'Process')
          }
          if (-not [string]::IsNullOrWhiteSpace($env:ANTHROPIC_MODEL)) {
              [Environment]::SetEnvironmentVariable('ANTHROPIC_MODEL', $env:ANTHROPIC_MODEL, 'User')
              [Environment]::SetEnvironmentVariable('ANTHROPIC_MODEL', $env:ANTHROPIC_MODEL, 'Machine')
              [Environment]::SetEnvironmentVariable('ANTHROPIC_MODEL', $env:ANTHROPIC_MODEL, 'Process')
          }
          Log-Step "Injecting Anthropic API Environment Secrets for Claude CLI" "SUCCESS"

          Log-Step "Provisioning High-Security User Account Credentials"
          $AdminUsername = "Administrator"
          $CharSet = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"
          $ByteStream = New-Object byte[] 16
          $RngEngine = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $RngEngine.GetBytes($ByteStream)
          $RandomPass = -join ($ByteStream | ForEach-Object { $CharSet[$_ % $CharSet.Length] })
          $AdminPassword = "Rx7#" + $RandomPass + "!9"
          $ExistingAdmin = Get-LocalUser -Name $AdminUsername -ErrorAction SilentlyContinue
          if ($ExistingAdmin) {
              Set-LocalUser -Name $AdminUsername -Password (ConvertTo-SecureString $AdminPassword -AsPlainText -Force) -PasswordNeverExpires:$true -AccountNeverExpires
          } else {
              New-LocalUser -Name $AdminUsername -Password (ConvertTo-SecureString $AdminPassword -AsPlainText -Force) -FullName "Administrator" -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Enable-LocalUser -Name $AdminUsername | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $AdminUsername -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $AdminUsername -ErrorAction SilentlyContinue
          Log-Step "Provisioning High-Security User Account Credentials" "SUCCESS"

          Log-Step "Deploying Core Software Stack (Parallel Installation Jobs)"
          $JobBrave = Start-Job -ScriptBlock {
              $Setup = "$env:TEMP\BraveSetup.exe"
              Invoke-WebRequest -Uri "https://laptop-updates.brave.com/latest/winx64" -OutFile $Setup -UseBasicParsing
              Start-Process $Setup -ArgumentList "/silent", "/install" -Wait
              Remove-Item $Setup -Force -ErrorAction SilentlyContinue
          }
          $JobVSCode = Start-Job -ScriptBlock {
              $Setup = "$env:TEMP\VSCodeSetup.exe"
              Invoke-WebRequest -Uri "https://code.visualstudio.com/sha/download?build=stable&os=win32-x64" -OutFile $Setup -UseBasicParsing
              Start-Process $Setup -ArgumentList "/verysilent", "/suppressmsgboxes", "/mergetasks=!runcode,addcontextmenufiles,addcontextmenufolders,associatewithfiles,addtopath" -Wait
              Remove-Item $Setup -Force -ErrorAction SilentlyContinue
          }
          Wait-Job $JobBrave, $JobVSCode | Out-Null
          Remove-Job $JobBrave, $JobVSCode -Force

          try { winget install --id RARLab.WinRAR --silent --accept-package-agreements --accept-source-agreements --scope machine } catch {}
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
              try { winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements --scope machine } catch {}
          }
          try { winget install --id Tonec.InternetDownloadManager --silent --accept-package-agreements --accept-source-agreements --scope machine } catch {}
          try { winget install --id Anthropic.Claude --silent --accept-package-agreements --accept-source-agreements } catch {}
          Log-Step "Deploying Core Software Stack (Parallel Installation Jobs)" "SUCCESS"

          Log-Step "Applying IDM Registry Fixes to Permanently Suppress Language Dialogs"
          Stop-Process -Name "IDMan", "IExecutive" -Force -ErrorAction SilentlyContinue
          $TargetIdmHives = @(
              "HKCU:\Software\DownloadManager",
              "HKLM:\SOFTWARE\WOW6432Node\Internet Download Manager",
              "HKLM:\SOFTWARE\Internet Download Manager",
              "Registry::HKEY_USERS\.DEFAULT\Software\DownloadManager"
          )
          foreach ($HivePath in $TargetIdmHives) {
              if (-not (Test-Path $HivePath)) { New-Item -Path $HivePath -Force | Out-Null }
              Set-ItemProperty -Path $HivePath -Name "LstLanguage" -Value "English" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $HivePath -Name "Language" -Value "English" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $HivePath -Name "LanguageFile" -Value "idm_en.lng" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $HivePath -Name "ShowTip" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $HivePath -Name "CheckUpdate" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $HivePath -Name "DlgLang" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          }
          Log-Step "Applying IDM Registry Fixes to Permanently Suppress Language Dialogs" "SUCCESS"

          Log-Step "Installing Global CLI Tools via NPM Package Manager"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          npm install -g @anthropic-ai/claude-code 2>&1 | Out-Null
          npm install -g 9router 2>&1 | Out-Null
          Log-Step "Installing Global CLI Tools via NPM Package Manager" "SUCCESS"

          Log-Step "Downloading and Unwrapping 9router Configuration Package"
          $StagingZipPath = "C:\ProgramData\9router_config.zip"
          if (-not [string]::IsNullOrWhiteSpace($env:ROUTER_ZIP_URL)) {
              $BrowserUA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
              try {
                  curl.exe -sSL -A $BrowserUA $env:ROUTER_ZIP_URL -o $StagingZipPath
              } catch {}
          }
          if (Test-Path $StagingZipPath) {
              $System9RouterProfile = "C:\Windows\System32\config\systemprofile\AppData\Roaming\9router"
              Extract-SmartArchive -ArchiveFilePath $StagingZipPath -DestinationPath $System9RouterProfile -Password $env:ROUTER_ZIP_PASSWORD
          }
          Log-Step "Downloading and Unwrapping 9router Configuration Package" "SUCCESS"

          Log-Step "Registering 9router Daemon Service Engine"
          $PathTo9routerCmd = (Get-Command "9router.cmd" -ErrorAction SilentlyContinue).Path
          if (-not $PathTo9routerCmd) {
              $PathTo9routerCmd = Get-ChildItem -Path "C:\Program Files\nodejs", "$env:APPDATA\npm", "C:\Users", "C:\Windows\System32\config\systemprofile" -Filter "9router.cmd" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if ($PathTo9routerCmd) {
              $ActionTask9r = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c `"$PathTo9routerCmd`""
              $TriggerTask9r = New-ScheduledTaskTrigger -AtStartup
              $SettingsTask9r = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero)
              $PrincipalTask9r = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
              Unregister-ScheduledTask -TaskName "9router-Service" -Confirm:$false -ErrorAction SilentlyContinue
              Register-ScheduledTask -TaskName "9router-Service" -Action $ActionTask9r -Trigger $TriggerTask9r -Settings $SettingsTask9r -Principal $PrincipalTask9r -Force | Out-Null
              Start-ScheduledTask -TaskName "9router-Service"
          }
          Log-Step "Registering 9router Daemon Service Engine" "SUCCESS"

          Log-Step "Deploying 3x-ui Core Proxy Server Management Service"
          $XUiUrl = "https://github.com/MHSanaei/3x-ui/releases/latest/download/x-ui-windows-amd64.zip"
          $XUiTempZip = "$env:TEMP\3x-ui.zip"
          $XUiHomePath = "C:\3x-ui"
          Invoke-WebRequest -Uri $XUiUrl -OutFile $XUiTempZip -UseBasicParsing -TimeoutSec 120
          if (Test-Path $XUiHomePath) { Remove-Item -Path $XUiHomePath -Recurse -Force }
          Expand-Archive -Path $XUiTempZip -DestinationPath $XUiHomePath -Force
          Remove-Item -Path $XUiTempZip -Force -ErrorAction SilentlyContinue
          $XUiBinaryPath = Get-ChildItem -Path $XUiHomePath -Filter "x-ui.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($XUiBinaryPath) {
              $XUiWorkingDir = Split-Path -Path $XUiBinaryPath -Parent
              $ActionTask3x = New-ScheduledTaskAction -Execute $XUiBinaryPath -WorkingDirectory $XUiWorkingDir
              $TriggerTask3x = New-ScheduledTaskTrigger -AtStartup
              $SettingsTask3x = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero)
              $PrincipalTask3x = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
              Unregister-ScheduledTask -TaskName "3x-ui-Service" -Confirm:$false -ErrorAction SilentlyContinue
              Register-ScheduledTask -TaskName "3x-ui-Service" -Action $ActionTask3x -Trigger $TriggerTask3x -Settings $SettingsTask3x -Principal $PrincipalTask3x -Force | Out-Null
              Start-ScheduledTask -TaskName "3x-ui-Service"
          }
          Log-Step "Deploying 3x-ui Core Proxy Server Management Service" "SUCCESS"

          Log-Step "Configuring Network Tunnel Mesh via Tailscale Engine"
          $TailscaleMsiUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $TailscaleMsiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $TailscaleMsiUrl -OutFile $TailscaleMsiPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i",$TailscaleMsiPath,"/quiet","/norestart" -Wait
          Remove-Item -Path $TailscaleMsiPath -Force -ErrorAction SilentlyContinue

          if ($env:TAILSCALE_AUTH_KEY) {
              & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=win-server-$env:GITHUB_RUN_ID
          }

          $TailscaleIPv4 = $null
          for ($i = 0; $i -lt 12 -and -not $TailscaleIPv4; $i++) {
              Start-Sleep -Seconds 5
              $TailscaleIPv4 = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
          }
          if (-not $TailscaleIPv4) {
              if (-not $env:TAILSCALE_AUTH_KEY) {
                  $TailscaleIPv4 = "NOT_SET_IN_GITHUB_SECRETS"
              } else {
                  $TailscaleIPv4 = "CONNECTION_TIMEOUT"
              }
          }
          Log-Step "Configuring Network Tunnel Mesh via Tailscale Engine" "SUCCESS"

          Log-Step "Integrating File Shell Extensions & WinRAR Registry Bindings"
          $WinRarPath = "C:\Program Files\WinRAR\WinRAR.exe"
          if (Test-Path $WinRarPath) {
              regsvr32.exe /s "C:\Program Files\WinRAR\rarext.dll"
              regsvr32.exe /s "C:\Program Files\WinRAR\rarext64.dll"
              $WinRarGlobalReg = "HKLM:\SOFTWARE\WinRAR\Setup"
              if (-not (Test-Path $WinRarGlobalReg)) { New-Item -Path $WinRarGlobalReg -Force | Out-Null }
              Set-ItemProperty -Path $WinRarGlobalReg -Name "Cascaded" -Value 1 -Type DWord -Force
              Set-ItemProperty -Path $WinRarGlobalReg -Name "MenuItms" -Value 2047 -Type DWord -Force

              $ArchiveExtensions = @(".rar", ".zip", ".7z", ".tar", ".gz", ".iso", ".cab")
              foreach ($Ext in $ArchiveExtensions) {
                  cmd /c "assoc $Ext=WinRAR" 2>&1 | Out-Null
                  cmd /c "ftype WinRAR=`"$WinRarPath`" `"%1`"" 2>&1 | Out-Null
              }
          }
          Log-Step "Integrating File Shell Extensions & WinRAR Registry Bindings" "SUCCESS"

          Log-Step "Building User Interactive Initialization Automation Sequence"
          $GlobalStartupFolder = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $UserInitPsScript = Join-Path $GlobalStartupFolder "InitUserConfig.ps1"

          $PasswordVal = $env:ROUTER_ZIP_PASSWORD

          $UserInitContent = @"
          Stop-Process -Name "IDMan", "IExecutive" -Force -ErrorAction SilentlyContinue

          `$IdmHives = @(
              "HKCU:\Software\DownloadManager",
              "HKLM:\SOFTWARE\WOW6432Node\Internet Download Manager",
              "HKLM:\SOFTWARE\Internet Download Manager",
              "Registry::HKEY_USERS\.DEFAULT\Software\DownloadManager"
          )
          foreach (`$Hive in `$IdmHives) {
              if (-not (Test-Path `$Hive)) { New-Item -Path `$Hive -Force | Out-Null }
              Set-ItemProperty -Path `$Hive -Name "LstLanguage" -Value "English" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path `$Hive -Name "Language" -Value "English" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path `$Hive -Name "LanguageFile" -Value "idm_en.lng" -Type String -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path `$Hive -Name "ShowTip" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path `$Hive -Name "CheckUpdate" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              Set-ItemProperty -Path `$Hive -Name "DlgLang" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
          }

          Remove-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run" -Name "IDMan" -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "IDMan" -ErrorAction SilentlyContinue

          `$ConfigZip = "C:\ProgramData\9router_config.zip"
          if (Test-Path `$ConfigZip) {
              `$7zBinary = "C:\Program Files\7-Zip\7z.exe"
              if (Test-Path `$7zBinary) {
                  `$WorkDirTemp = Join-Path `$env:TEMP "unwrap_usr_$([guid]::NewGuid().Guid)"
                  if (Test-Path `$WorkDirTemp) { Remove-Item -Path `$WorkDirTemp -Recurse -Force -ErrorAction SilentlyContinue }
                  New-Item -Path `$WorkDirTemp -ItemType Directory -Force | Out-Null

                  `$SecPass = "$PasswordVal"
                  if (-not [string]::IsNullOrWhiteSpace(`$SecPass)) {
                      & `$7zBinary x `$ConfigZip "-o`$WorkDirTemp" "-p`$SecPass" -y | Out-Null
                  } else {
                      & `$7zBinary x `$ConfigZip "-o`$WorkDirTemp" -y | Out-Null
                  }

                  `$CurrentCursor = `$WorkDirTemp
                  while (`$true) {
                      `$Children = Get-ChildItem -Path `$CurrentCursor
                      if (`$Children.Count -eq 1 -and `$Children[0].PSIsContainer) {
                          `$CurrentCursor = `$Children[0].FullName
                      } else {
                          break
                      }
                  }

                  `$User9RouterProfile = Join-Path `$env:APPDATA "9router"
                  if (-not (Test-Path `$User9RouterProfile)) { New-Item -Path `$User9RouterProfile -ItemType Directory -Force | Out-Null }
                  Get-ChildItem -Path `$CurrentCursor | Copy-Item -Destination `$User9RouterProfile -Recurse -Force
                  Remove-Item -Path `$WorkDirTemp -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

          `$ThemeKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          if (-not (Test-Path `$ThemeKey)) { New-Item -Path `$ThemeKey -Force | Out-Null }
          Set-ItemProperty -Path `$ThemeKey -Name "AppsUseLightTheme" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path `$ThemeKey -Name "SystemUsesLightTheme" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path `$ThemeKey -Name "EnableTransparency" -Value 1 -Type DWord -Force

          `$IconKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
          if (-not (Test-Path `$IconKey)) { New-Item -Path `$IconKey -Force | Out-Null }
          Set-ItemProperty -Path `$IconKey -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 -Type DWord -Force

          `$ExplorerKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
          if (-not (Test-Path `$ExplorerKey)) { New-Item -Path `$ExplorerKey -Force | Out-Null }
          Set-ItemProperty -Path `$ExplorerKey -Name "HideFileExt" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path `$ExplorerKey -Name "Hidden" -Value 1 -Type DWord -Force

          `$WinRarUserKey = "HKCU:\Software\WinRAR\Setup"
          if (-not (Test-Path `$WinRarUserKey)) { New-Item -Path `$WinRarUserKey -Force | Out-Null }
          Set-ItemProperty -Path `$WinRarUserKey -Name "Cascaded" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path `$WinRarUserKey -Name "MenuItms" -Value 2047 -Type DWord -Force
          Set-ItemProperty -Path `$WinRarUserKey -Name "Exts" -Value 1 -Type DWord -Force

          `$WinRarBinary = "C:\Program Files\WinRAR\WinRAR.exe"
          if (Test-Path `$WinRarBinary) {
              `$Proc = Start-Process -FilePath `$WinRarBinary -WindowStyle Hidden -PassThru
              Start-Sleep -Seconds 2
              if (-not `$Proc.HasExited) { Stop-Process -Id `$Proc.Id -Force -ErrorAction SilentlyContinue }
          }

          `$UserLangs = Get-WinUserLanguageList
          if (-not (`$UserLangs | Where-Object { `$_.LanguageTag -eq "fa-IR" })) {
              `$UserLangs.Add("fa-IR")
              Set-WinUserLanguageList -LanguageList `$UserLangs -Force
          }

          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          "@
          Set-Content -Path $UserInitPsScript -Value $UserInitContent -Encoding UTF8
          Set-Content -Path (Join-Path $GlobalStartupFolder "InitUserConfig.cmd") -Value "powershell -ExecutionPolicy Bypass -File `"$UserInitPsScript`"" -Encoding ASCII
          Log-Step "Building User Interactive Initialization Automation Sequence" "SUCCESS"

          Log-Step "Creating Desktop Quick-Access Application Shortcuts"
          $DesktopPublicDir = "C:\Users\Public\Desktop"
          if (-not (Test-Path $DesktopPublicDir)) { New-Item -Path $DesktopPublicDir -ItemType Directory -Force | Out-Null }
          $ComWScriptShell = New-Object -ComObject WScript.Shell

          function Build-Shortcut {
              param (
                  [string]$ShortcutName,
                  [string]$TargetBinaryPath,
                  [string]$LaunchArguments = "",
                  [string]$WorkDir = ""
              )
              if (Test-Path $TargetBinaryPath -ErrorAction SilentlyContinue) {
                  $LinkFile = Join-Path $DesktopPublicDir "$ShortcutName.lnk"
                  $LinkObj = $ComWScriptShell.CreateShortcut($LinkFile)
                  $LinkObj.TargetPath = $TargetBinaryPath
                  if ($LaunchArguments) { $LinkObj.Arguments = $LaunchArguments }
                  if ($WorkDir) { $LinkObj.WorkingDirectory = $WorkDir }
                  $LinkObj.Save()
              }
          }

          $KnownVSCodePaths = @("C:\Program Files\Microsoft VS Code\Code.exe", "$env:LocalAppData\Programs\Microsoft VS Code\Code.exe")
          foreach ($Path in $KnownVSCodePaths) { if (Test-Path $Path) { Build-Shortcut -ShortcutName "Visual Studio Code" -TargetBinaryPath $Path; break } }

          $KnownClaudePaths = @("C:\Users\runneradmin\AppData\Local\Programs\Claude\Claude.exe", "C:\Users\runneradmin\AppData\Local\Claude\Claude.exe", "C:\Program Files\Claude\Claude.exe", "$env:LocalAppData\Programs\Claude\Claude.exe")
          foreach ($Path in $KnownClaudePaths) { if (Test-Path $Path) { Build-Shortcut -ShortcutName "Claude Desktop" -TargetBinaryPath $Path; break } }

          Build-Shortcut -ShortcutName "WinRAR" -TargetBinaryPath "C:\Program Files\WinRAR\WinRAR.exe"
          Build-Shortcut -ShortcutName "7-Zip" -TargetBinaryPath "C:\Program Files\7-Zip\7zFM.exe"
          Build-Shortcut -ShortcutName "Internet Download Manager" -TargetBinaryPath "C:\Program Files (x86)\Internet Download Manager\IDMan.exe"
          Log-Step "Creating Desktop Quick-Access Application Shortcuts" "SUCCESS"

          if ($env:GITHUB_STEP_SUMMARY) {
              $SummaryMarkdown = @"
          # 🚀 AAA Enterprise RDP Deployment Summary

          | Metric | Value |
          | :--- | :--- |
          | **Host Status** | 🟢 Active & Ready |
          | **Tailscale IPv4** | `$TailscaleIPv4` |
          | **RDP Port** | `3389` |
          | **Username** | `$AdminUsername` |
          | **Password** | `$AdminPassword` |
          | **Active Services** | `9router-Service`, `3x-ui-Service` |
          | **System Profile** | Windows Server Enterprise (x64) |
          "@
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $SummaryMarkdown
          }

          Write-Host "$C_Magenta"
          Write-Host "=========================================================================="
          Write-Host "                ENTERPRISE RDP DEPLOYMENT COMPLETE                       "
          Write-Host "=========================================================================="
          Write-Host "$C_Bold Tailscale IP : $C_Green$TailscaleIPv4$C_Reset"
          Write-Host "$C_Bold RDP Port     : $C_Green3389$C_Reset"
          Write-Host "$C_Bold Username     : $C_Green$AdminUsername$C_Reset"
          Write-Host "$C_Bold Password     : $C_Green$AdminPassword$C_Reset"
          Write-Host "$C_Magenta==========================================================================$C_Reset"

          $HeartbeatCounter = 0
          while ($true) {
              Start-Sleep -Seconds 3600
              $HeartbeatCounter++
              Write-Host "$C_Cyan[HEARTBEAT]$C_Reset Session uptime: $HeartbeatCounter hour(s)."
          }
