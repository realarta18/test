name: Secure Windows Environment RDP

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure System and Enable RDP
        run: |
          Set-Service -Name seclogon -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name seclogon -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "LocalAccountTokenFilterPolicy" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "ConsentPromptBehaviorAdmin" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "ConsentPromptBehaviorUser" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "EnableInstallerDetection" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "EnableLUA" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "PromptOnSecureDesktop" -Value 0 -Force
          Set-Service -Name TermService -StartupType Automatic
          net accounts /lockoutthreshold:0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="RDP-Inbound-3389" Out-Null
          netsh advfirewall firewall add rule name="RDP-Inbound-3389" dir=in action=allow protocol=TCP localport=3389
          powercfg /change standby-timeout-ac 0
          powercfg /change standby-timeout-dc 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change hibernate-timeout-dc 0
          powercfg /change disk-timeout-ac 0
          powercfg /change disk-timeout-dc 0
          powercfg /hibernate off
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Set-TimeZone -Id "Iran Standard Time"
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" -Name "NoAutoUpdate" -Value 1 -Type DWord -Force
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Name "DisableSoftLanding" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent" -Name "DisableWindowsConsumerFeatures" -Value 1 -Type DWord -Force
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Type DWord -Force
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection" -Name "AllowTelemetry" -Value 0 -Type DWord -Force
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender" -Name "DisableAntiSpyware" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection" -Name "DisableRealtimeMonitoring" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue } catch {}
          Restart-Service -Name TermService -Force

      - name: Provision Administrator Account
        run: |
          $Username = "Administrator"
          $Chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"
          $Bytes = New-Object byte[] 16
          (New-Object System.Security.Cryptography.RNGCryptoServiceProvider).GetBytes($Bytes)
          $RandomPart = -join ($Bytes | ForEach-Object { $Chars[$_ % $Chars.Length] })
          $Password = "Rx7#" + $RandomPart + "!9"
          Write-Host "::add-mask::$Password"
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force
          $ExistingUser = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($ExistingUser) {
              Set-LocalUser -Name $Username -Password $SecurePassword -PasswordNeverExpires:$true -AccountNeverExpires
          } else {
              New-LocalUser -Name $Username -Password $SecurePassword -FullName "Administrator" -Description "Primary Administrator Account" -PasswordNeverExpires -AccountNeverExpires
          }
          Enable-LocalUser -Name $Username
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue
          "RDP_USER=$Username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASS=$Password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply Desktop Theme and Configuration
        continue-on-error: true
        run: |
          $DefaultTheme = "Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          if (-not (Test-Path $DefaultTheme)) { New-Item -Path $DefaultTheme -Force | Out-Null }
          Set-ItemProperty -Path $DefaultTheme -Name "AppsUseLightTheme" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $DefaultTheme -Name "SystemUsesLightTheme" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $DefaultTheme -Name "EnableTransparency" -Value 1 -Type DWord -Force
          $DefaultIcons = "Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
          if (-not (Test-Path $DefaultIcons)) { New-Item -Path $DefaultIcons -Force | Out-Null }
          Set-ItemProperty -Path $DefaultIcons -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $DefaultIcons -Name "{59031a47-3f72-44a7-89c5-5595fe6b30ee}" -Value 0 -Type DWord -Force

          reg load HKU\DefUser "C:\Users\Default\NTUSER.DAT"
          $DefPath = "Registry::HKEY_USERS\DefUser\Software\Microsoft\Windows\CurrentVersion"
          New-Item -Path "$DefPath\Themes\Personalize" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "$DefPath\Themes\Personalize" -Name "AppsUseLightTheme" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$DefPath\Themes\Personalize" -Name "SystemUsesLightTheme" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$DefPath\Themes\Personalize" -Name "EnableTransparency" -Value 1 -Type DWord -Force
          New-Item -Path "$DefPath\Explorer\Advanced" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "$DefPath\Explorer\Advanced" -Name "HideFileExt" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "$DefPath\Explorer\Advanced" -Name "Hidden" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "$DefPath\Explorer\Advanced" -Name "LaunchTo" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "$DefPath\Explorer\Advanced" -Name "TaskbarSmallIcons" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path "$DefPath\Explorer\Advanced" -Name "ShowTaskViewButton" -Value 0 -Type DWord -Force
          [gc]::Collect()
          reg unload HKU\DefUser

          $LanguageList = Get-WinUserLanguageList
          if (-not ($LanguageList | Where-Object { $_.LanguageTag -eq "fa-IR" })) {
              $LanguageList.Add("fa-IR")
              Set-WinUserLanguageList -LanguageList $LanguageList -Force
          }
          $DefaultKbd = "Registry::HKEY_USERS\.DEFAULT\Keyboard Layout\Preload"
          if (-not (Test-Path $DefaultKbd)) { New-Item -Path $DefaultKbd -Force | Out-Null }
          Set-ItemProperty -Path $DefaultKbd -Name "1" -Value "00000409" -Force
          Set-ItemProperty -Path $DefaultKbd -Name "2" -Value "00000429" -Force

      - name: Install Brave Browser
        continue-on-error: true
        run: |
          winget install --id Brave.Brave --silent --accept-package-agreements --accept-source-agreements

      - name: Install Visual Studio Code
        continue-on-error: true
        run: |
          winget install --id Microsoft.VisualStudioCode --silent --accept-package-agreements --accept-source-agreements

      - name: Install WinRAR
        continue-on-error: true
        run: |
          winget install --id RARLab.WinRAR --silent --accept-package-agreements --accept-source-agreements

      - name: Install 7-Zip
        continue-on-error: true
        run: |
          winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements

      - name: Install Internet Download Manager
        continue-on-error: true
        run: |
          winget install --id Tonec.InternetDownloadManager --silent --accept-package-agreements --accept-source-agreements

      - name: Install Claude Desktop
        continue-on-error: true
        run: |
          winget install --id Anthropic.Claude --silent --accept-package-agreements --accept-source-agreements

      - name: Install CLI Tools
        continue-on-error: true
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          npm install -g @anthropic-ai/claude-code 2>&1
          npm install -g 9router 2>&1

      - name: Deploy 3x-ui Panel as Persistent Service
        continue-on-error: true
        run: |
          $Url = "https://github.com/MHSanaei/3x-ui/releases/download/v3.6.0/x-ui-windows-amd64.zip"
          $ZipPath = "$env:TEMP\3x-ui.zip"
          $InstallPath = "C:\3x-ui"
          for ($i = 1; $i -le 5; $i++) {
              try {
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  Invoke-WebRequest -Uri $Url -OutFile $ZipPath -UseBasicParsing -TimeoutSec 120
                  break
              } catch { Start-Sleep -Seconds 5 }
          }
          if (Test-Path $InstallPath) { Remove-Item -Path $InstallPath -Recurse -Force }
          Expand-Archive -Path $ZipPath -DestinationPath $InstallPath -Force
          Remove-Item -Path $ZipPath -Force -ErrorAction SilentlyContinue
          $ExePath = Get-ChildItem -Path $InstallPath -Filter "x-ui.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($ExePath) {
              $WorkDir = Split-Path -Path $ExePath -Parent
              $Action = New-ScheduledTaskAction -Execute $ExePath -WorkingDirectory $WorkDir
              $Trigger = New-ScheduledTaskTrigger -AtStartup
              $Settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero)
              $Principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
              Unregister-ScheduledTask -TaskName "3x-ui-Service" -Confirm:$false -ErrorAction SilentlyContinue
              Register-ScheduledTask -TaskName "3x-ui-Service" -Action $Action -Trigger $Trigger -Settings $Settings -Principal $Principal -Force
              Start-ScheduledTask -TaskName "3x-ui-Service"
          }

      - name: Establish Tailscale Secure Tunnel
        run: |
          $TsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $Installer = "$env:TEMP\tailscale.msi"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $TsUrl -OutFile $Installer
          Start-Process msiexec.exe -ArgumentList "/i",$Installer,"/quiet","/norestart" -Wait
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-server-$env:GITHUB_RUN_ID
          $TsIP = $null
          for ($i = 0; $i -lt 12 -and -not $TsIP; $i++) {
              Start-Sleep -Seconds 5
              $TsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          }
          if ($TsIP) {
              "TAILSCALE_IP=$TsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Display Access Credentials and Maintain Session
        if: always()
        run: |
          Write-Host "=================================================="
          Write-Host "         SECURE RDP SESSION ESTABLISHED          "
          Write-Host "=================================================="
          Write-Host " Tailscale IP : $env:TAILSCALE_IP"
          Write-Host " RDP Port     : 3389"
          Write-Host " Username     : $env:RDP_USER"
          Write-Host " Password     : $env:RDP_PASS"
          Write-Host "=================================================="
          while ($true) {
              Start-Sleep -Seconds 3600
          }
