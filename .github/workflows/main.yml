name: Remote Desktop Environment Setup

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest
    steps:
      - name: Deploy Environment
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ROUTER_ZIP_URL: ${{ secrets.ROUTER_ZIP_URL }}
          ROUTER_ZIP_PASSWORD: ${{ secrets.ROUTER_ZIP_PASSWORD }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
  
          Set-Service -Name seclogon -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name seclogon -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "LocalAccountTokenFilterPolicy" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "ConsentPromptBehaviorAdmin" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "ConsentPromptBehaviorUser" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "EnableLUA" -Value 0 -Force
          Set-Service -Name TermService -StartupType Automatic
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Inbound-3389" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -ErrorAction SilentlyContinue | Out-Null
          powercfg /change standby-timeout-ac 0
          powercfg /change standby-timeout-dc 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          powercfg /hibernate off
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Type DWord -Force
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue } catch {}
          Restart-Service -Name TermService -Force

          $Username = "Administrator"
          $Chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"
          $Bytes = New-Object byte[] 16
          (New-Object System.Security.Cryptography.RNGCryptoServiceProvider).GetBytes($Bytes)
          $RandomPart = -join ($Bytes | ForEach-Object { $Chars[$_ % $Chars.Length] })
          $Password = "Rx7#" + $RandomPart + "!9"
          $ExistingUser = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($ExistingUser) {
              Set-LocalUser -Name $Username -Password (ConvertTo-SecureString $Password -AsPlainText -Force) -PasswordNeverExpires:$true -AccountNeverExpires
          } else {
              New-LocalUser -Name $Username -Password (ConvertTo-SecureString $Password -AsPlainText -Force) -FullName "Administrator" -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Enable-LocalUser -Name $Username | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue

          $BraveSetup = "$env:TEMP\BraveSetup.exe"
          Invoke-WebRequest -Uri "https://laptop-updates.brave.com/latest/winx64" -OutFile $BraveSetup -UseBasicParsing
          Start-Process $BraveSetup -ArgumentList "/silent", "/install" -Wait
          Remove-Item $BraveSetup -Force -ErrorAction SilentlyContinue

          $VSCodeSetup = "$env:TEMP\VSCodeSetup.exe"
          Invoke-WebRequest -Uri "https://code.visualstudio.com/sha/download?build=stable&os=win32-x64" -OutFile $VSCodeSetup -UseBasicParsing
          Start-Process $VSCodeSetup -ArgumentList "/verysilent", "/suppressmsgboxes", "/mergetasks=!runcode,addcontextmenufiles,addcontextmenufolders,associatewithfiles,addtopath" -Wait
          Remove-Item $VSCodeSetup -Force -ErrorAction SilentlyContinue

          try { winget install --id RARLab.WinRAR --silent --accept-package-agreements --accept-source-agreements --scope machine } catch {}
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
              try { winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements --scope machine } catch {}
          }
          try { winget install --id Tonec.InternetDownloadManager --silent --accept-package-agreements --accept-source-agreements --scope machine } catch {}
          try { winget install --id Anthropic.Claude --silent --accept-package-agreements --accept-source-agreements } catch {}

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          npm install -g @anthropic-ai/claude-code 2>&1 | Out-Null
          npm install -g 9router 2>&1 | Out-Null

          $RouterDir = "C:\Users\Administrator\AppData\Roaming"
          $ZipPath = "$env:TEMP\9router.zip"
          $DirectUrl = $env:ROUTER_ZIP_URL
          $ZipPassword = $env:ROUTER_ZIP_PASSWORD

          if ($DirectUrl) {
              if (-not (Test-Path $RouterDir)) { 
                  New-Item -Path $RouterDir -ItemType Directory -Force | Out-Null 
              }

              $UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
              curl.exe -sSL -A $UA $DirectUrl -o $ZipPath

              $7zExe = "C:\Program Files\7-Zip\7z.exe"
              if (-not (Test-Path $7zExe)) {
                  try { winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements --scope machine } catch {}
              }

              if (Test-Path $ZipPath) {
                  & $7zExe x $ZipPath "-o$RouterDir" "-p$ZipPassword" -y | Out-Null
                  Remove-Item -Path $ZipPath -Force -ErrorAction SilentlyContinue
              }
          }

          $Url = "https://github.com/MHSanaei/3x-ui/releases/latest/download/x-ui-windows-amd64.zip"
          $ZipPath = "$env:TEMP\3x-ui.zip"
          $InstallPath = "C:\3x-ui"
          Invoke-WebRequest -Uri $Url -OutFile $ZipPath -UseBasicParsing -TimeoutSec 120
          if (Test-Path $InstallPath) { Remove-Item -Path $InstallPath -Recurse -Force }
          Expand-Archive -Path $ZipPath -DestinationPath $InstallPath -Force
          Remove-Item -Path $ZipPath -Force -ErrorAction SilentlyContinue
          $ExePath = Get-ChildItem -Path $InstallPath -Filter "x-ui.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($ExePath) {
              $WorkDir = Split-Path -Path $ExePath -Parent
              $Action = New-ScheduledTaskAction -Execute $ExePath -WorkingDirectory $WorkDir
              $Trigger = New-ScheduledTaskTrigger -AtStartup
              $Settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero)
              $Principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
              Unregister-ScheduledTask -TaskName "3x-ui-Service" -Confirm:$false -ErrorAction SilentlyContinue
              Register-ScheduledTask -TaskName "3x-ui-Service" -Action $Action -Trigger $Trigger -Settings $Settings -Principal $Principal -Force | Out-Null
              Start-ScheduledTask -TaskName "3x-ui-Service"
          }

          $TsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $Installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $TsUrl -OutFile $Installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i",$Installer,"/quiet","/norestart" -Wait
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue

          if ($env:TAILSCALE_AUTH_KEY) {
              & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=win-server-$env:GITHUB_RUN_ID
          }

          $TsIP = $null
          for ($i = 0; $i -lt 12 -and -not $TsIP; $i++) {
              Start-Sleep -Seconds 5
              $TsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
          }
          if (-not $TsIP) {
              if (-not $env:TAILSCALE_AUTH_KEY) {
                  $TsIP = "NOT_SET_IN_GITHUB_SECRETS"
              } else {
                  $TsIP = "CONNECTION_TIMEOUT"
              }
          }

          $WinRarExe = "C:\Program Files\WinRAR\WinRAR.exe"
          if (Test-Path $WinRarExe) {
              regsvr32.exe /s "C:\Program Files\WinRAR\rarext.dll"
              regsvr32.exe /s "C:\Program Files\WinRAR\rarext64.dll"
              $WinRarHKLM = "HKLM:\SOFTWARE\WinRAR\Setup"
              if (-not (Test-Path $WinRarHKLM)) { New-Item -Path $WinRarHKLM -Force | Out-Null }
              Set-ItemProperty -Path $WinRarHKLM -Name "Cascaded" -Value 1 -Type DWord -Force
              Set-ItemProperty -Path $WinRarHKLM -Name "MenuItms" -Value 2047 -Type DWord -Force

              $AssocList = @(".rar", ".zip", ".7z", ".tar", ".gz", ".iso", ".cab")
              foreach ($ext in $AssocList) {
                  cmd /c "assoc $ext=WinRAR" 2>&1 | Out-Null
                  cmd /c "ftype WinRAR=`"$WinRarExe`" `"%1`"" 2>&1 | Out-Null
              }
          }

          $StartupFolder = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $UserInitScript = Join-Path $StartupFolder "InitUserConfig.ps1"
          $UserInitCmd = Join-Path $StartupFolder "InitUserConfig.cmd"

          $InitScriptContent = @'
          Stop-Process -Name "IDMan" -Force -ErrorAction SilentlyContinue

          $Personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          if (-not (Test-Path $Personalize)) { New-Item -Path $Personalize -Force | Out-Null }
          Set-ItemProperty -Path $Personalize -Name "AppsUseLightTheme" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $Personalize -Name "SystemUsesLightTheme" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $Personalize -Name "EnableTransparency" -Value 1 -Type DWord -Force

          $DesktopIcons = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
          if (-not (Test-Path $DesktopIcons)) { New-Item -Path $DesktopIcons -Force | Out-Null }
          Set-ItemProperty -Path $DesktopIcons -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 -Type DWord -Force

          $ExplorerAdv = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
          if (-not (Test-Path $ExplorerAdv)) { New-Item -Path $ExplorerAdv -Force | Out-Null }
          Set-ItemProperty -Path $ExplorerAdv -Name "HideFileExt" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $ExplorerAdv -Name "Hidden" -Value 1 -Type DWord -Force

          $WinRarReg = "HKCU:\Software\WinRAR\Setup"
          if (-not (Test-Path $WinRarReg)) { New-Item -Path $WinRarReg -Force | Out-Null }
          Set-ItemProperty -Path $WinRarReg -Name "Cascaded" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $WinRarReg -Name "MenuItms" -Value 2047 -Type DWord -Force
          Set-ItemProperty -Path $WinRarReg -Name "Exts" -Value 1 -Type DWord -Force

          $IdmReg = "HKCU:\Software\DownloadManager"
          if (-not (Test-Path $IdmReg)) { New-Item -Path $IdmReg -Force | Out-Null }
          Set-ItemProperty -Path $IdmReg -Name "LstLanguage" -Value "English" -Type String -Force

          Remove-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run" -Name "IDMan" -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "IDMan" -ErrorAction SilentlyContinue

          $WinRarExe = "C:\Program Files\WinRAR\WinRAR.exe"
          if (Test-Path $WinRarExe) {
              $p = Start-Process -FilePath $WinRarExe -WindowStyle Hidden -PassThru
              Start-Sleep -Seconds 2
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

          $LangList = Get-WinUserLanguageList
          if (-not ($LangList | Where-Object { $_.LanguageTag -eq "fa-IR" })) {
              $LangList.Add("fa-IR")
              Set-WinUserLanguageList -LanguageList $LangList -Force
          }

          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          '@
          Set-Content -Path $UserInitScript -Value $InitScriptContent -Encoding UTF8
          Set-Content -Path $UserInitCmd -Value "powershell -ExecutionPolicy Bypass -File `"$UserInitScript`"" -Encoding ASCII

          $PublicDesktop = "C:\Users\Public\Desktop"
          if (-not (Test-Path $PublicDesktop)) { New-Item -Path $PublicDesktop -ItemType Directory -Force | Out-Null }
          $WScriptShell = New-Object -ComObject WScript.Shell

          function Create-Shortcut {
              param (
                  [string]$Name,
                  [string]$TargetPath,
                  [string]$Arguments = "",
                  [string]$WorkingDirectory = ""
              )
              if (Test-Path $TargetPath -ErrorAction SilentlyContinue) {
                  $ShortcutPath = Join-Path $PublicDesktop "$Name.lnk"
                  $Shortcut = $WScriptShell.CreateShortcut($ShortcutPath)
                  $Shortcut.TargetPath = $TargetPath
                  if ($Arguments) { $Shortcut.Arguments = $Arguments }
                  if ($WorkingDirectory) { $Shortcut.WorkingDirectory = $WorkingDirectory }
                  $Shortcut.Save()
              }
          }

          $VSCodePaths = @("C:\Program Files\Microsoft VS Code\Code.exe", "$env:LocalAppData\Programs\Microsoft VS Code\Code.exe")
          foreach ($vsp in $VSCodePaths) { if (Test-Path $vsp) { Create-Shortcut -Name "Visual Studio Code" -TargetPath $vsp; break } }

          $ClaudePaths = @("C:\Users\runneradmin\AppData\Local\Programs\Claude\Claude.exe", "C:\Users\runneradmin\AppData\Local\Claude\Claude.exe", "C:\Program Files\Claude\Claude.exe", "$env:LocalAppData\Programs\Claude\Claude.exe")
          foreach ($cp in $ClaudePaths) { if (Test-Path $cp) { Create-Shortcut -Name "Claude Desktop" -TargetPath $cp; break } }

          Create-Shortcut -Name "WinRAR" -TargetPath "C:\Program Files\WinRAR\WinRAR.exe"
          Create-Shortcut -Name "7-Zip" -TargetPath "C:\Program Files\7-Zip\7zFM.exe"
          Create-Shortcut -Name "Internet Download Manager" -TargetPath "C:\Program Files (x86)\Internet Download Manager\IDMan.exe"

          Write-Host "=================================================="
          Write-Host "         SECURE RDP SESSION ESTABLISHED          "
          Write-Host "=================================================="
          Write-Host " Tailscale IP : $TsIP"
          Write-Host " RDP Port     : 3389"
          Write-Host " Username     : $Username"
          Write-Host " Password     : $Password"
          Write-Host "=================================================="

          while ($true) {
              Start-Sleep -Seconds 3600
          }
