name: Secure Windows Environment RDP

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Harden System and Enable RDP Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name "LocalAccountTokenFilterPolicy" -Value 1 -Force
          Set-Service -Name TermService -StartupType Automatic
          net accounts /lockoutthreshold:0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="RDP-Inbound-3389" >$null 2>&1
          netsh advfirewall firewall add rule name="RDP-Inbound-3389" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Provision Administrator Account
        run: |
          $Username = "Administrator"
          $Chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"
          $Bytes = New-Object byte[] 14
          (New-Object System.Security.Cryptography.RNGCryptoServiceProvider).GetBytes($Bytes)
          $Password = "Rx7#" + (-join ($Bytes | ForEach-Object { $Chars[$_ % $Chars.Length] })) + "!9"
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force
          $ExistingUser = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($ExistingUser) {
              Set-LocalUser -Name $Username -Password $SecurePassword -PasswordNeverExpires:$true -AccountNeverExpires
          } else {
              New-LocalUser -Name $Username -Password $SecurePassword -FullName "Administrator" -Description "Primary Administrator Account" -PasswordNeverExpires -AccountNeverExpires
          }
          Enable-LocalUser -Name $Username
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue
          "RDP_USER=$Username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASS=$Password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply Desktop Theme and Keyboard Configuration
        run: |
          $ThemePaths = @(
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize",
              "Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          )
          foreach ($Path in $ThemePaths) {
              if (-not (Test-Path $Path)) { New-Item -Path $Path -Force | Out-Null }
              Set-ItemProperty -Path $Path -Name "AppsUseLightTheme" -Value 0 -Force
              Set-ItemProperty -Path $Path -Name "SystemUsesLightTheme" -Value 0 -Force
              Set-ItemProperty -Path $Path -Name "EnableTransparency" -Value 1 -Force
          }
          $IconPaths = @(
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel",
              "Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
          )
          foreach ($Path in $IconPaths) {
              if (-not (Test-Path $Path)) { New-Item -Path $Path -Force | Out-Null }
              Set-ItemProperty -Path $Path -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 -Force
              Set-ItemProperty -Path $Path -Name "{59031a47-3f72-44a7-89c5-5595fe6b30ee}" -Value 0 -Force
          }
          $LanguageList = Get-WinUserLanguageList
          if (-not ($LanguageList | Where-Object { $_.LanguageTag -eq "fa-IR" })) {
              $LanguageList.Add("fa-IR")
              Set-WinUserLanguageList -LanguageList $LanguageList -Force
          }
          $KeyboardPaths = @(
              "HKCU:\Keyboard Layout\Preload",
              "Registry::HKEY_USERS\.DEFAULT\Keyboard Layout\Preload"
          )
          foreach ($Path in $KeyboardPaths) {
              if (-not (Test-Path $Path)) { New-Item -Path $Path -Force | Out-Null }
              Set-ItemProperty -Path $Path -Name "1" -Value "00000409" -Force
              Set-ItemProperty -Path $Path -Name "2" -Value "00000429" -Force
          }
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue

      - name: Install Brave Browser
        run: |
          $Url = "https://laptop-updates.brave.com/latest/winx64"
          $Installer = "$env:TEMP\BraveSetup.exe"
          for ($i = 1; $i -le 3; $i++) {
              try {
                  Invoke-WebRequest -Uri $Url -OutFile $Installer -UseBasicParsing
                  break
              } catch { Start-Sleep -Seconds 5 }
          }
          Start-Process -FilePath $Installer -ArgumentList "/silent", "/install" -Wait
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue

      - name: Install Visual Studio Code
        run: |
          $Url = "https://update.code.visualstudio.com/latest/win32-x64/stable"
          $Installer = "$env:TEMP\VSCodeSetup.exe"
          for ($i = 1; $i -le 3; $i++) {
              try {
                  Invoke-WebRequest -Uri $Url -OutFile $Installer -UseBasicParsing
                  break
              } catch { Start-Sleep -Seconds 5 }
          }
          Start-Process -FilePath $Installer -ArgumentList "/verysilent", "/norestart", "/mergetasks=!runcode,addcontextmenufiles,addcontextmenufolders,associatewithfiles,addtopath" -Wait
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue

      - name: Install Internet Download Manager
        run: |
          $Url = "https://mirror2.internetdownloadmanager.com/idman642build25.exe"
          $Installer = "$env:TEMP\idman_setup.exe"
          for ($i = 1; $i -le 3; $i++) {
              try {
                  Invoke-WebRequest -Uri $Url -OutFile $Installer -UseBasicParsing -UserAgent "Mozilla/5.0"
                  break
              } catch { Start-Sleep -Seconds 5 }
          }
          $Process = Start-Process -FilePath $Installer -ArgumentList "/s" -PassThru
          Start-Sleep -Seconds 20
          if (-not $Process.HasExited) {
              Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "idman*", "IEMonitor*" -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue

      - name: Deploy 3x-ui Panel as Persistent Service
        run: |
          $Url = "https://github.com/MHSanaei/3x-ui/releases/download/v3.6.0/x-ui-windows-amd64.zip"
          $ZipPath = "$env:TEMP\3x-ui.zip"
          $InstallPath = "C:\3x-ui"
          for ($i = 1; $i -le 3; $i++) {
              try {
                  Invoke-WebRequest -Uri $Url -OutFile $ZipPath -UseBasicParsing
                  break
              } catch { Start-Sleep -Seconds 5 }
          }
          if (Test-Path $InstallPath) { Remove-Item -Path $InstallPath -Recurse -Force }
          Expand-Archive -Path $ZipPath -DestinationPath $InstallPath -Force
          Remove-Item -Path $ZipPath -Force -ErrorAction SilentlyContinue
          $ExePath = Get-ChildItem -Path $InstallPath -Filter "x-ui.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($ExePath) {
              $WorkDir = Split-Path -Path $ExePath -Parent
              $Action = New-ScheduledTaskAction -Execute $ExePath -WorkingDirectory $WorkDir
              $Trigger = New-ScheduledTaskTrigger -AtStartup
              $Settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero)
              $Principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
              Unregister-ScheduledTask -TaskName "3x-ui-Service" -Confirm:$false -ErrorAction SilentlyContinue
              Register-ScheduledTask -TaskName "3x-ui-Service" -Action $Action -Trigger $Trigger -Settings $Settings -Principal $Principal -Force
              Start-ScheduledTask -TaskName "3x-ui-Service"
          }

      - name: Establish High-Speed TCP Tunnel
        run: |
          $Address = $null

          $BoreDir = "C:\bore"
          New-Item -Path $BoreDir -ItemType Directory -Force | Out-Null
          $ZipPath = "$env:TEMP\bore.zip"

          try {
              $Headers = @{ "User-Agent" = "GitHubActions-Workflow" }
              $Release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest" -Headers $Headers -ErrorAction Stop
              $Asset = $Release.assets | Where-Object { $_.name -match "windows" -and $_.name -match "\.zip$" } | Select-Object -First 1

              if (-not $Asset) {
                  throw "No matching Windows asset found in bore latest release."
              }

              Invoke-WebRequest -Uri $Asset.browser_download_url -OutFile $ZipPath -UseBasicParsing -ErrorAction Stop
              Expand-Archive -Path $ZipPath -DestinationPath $BoreDir -Force
              Remove-Item -Path $ZipPath -Force -ErrorAction SilentlyContinue

              $BoreExe = Get-ChildItem -Path $BoreDir -Filter "bore.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName

              if (-not $BoreExe) {
                  throw "bore.exe not found after extraction."
              }

              $BoreOut = "$env:TEMP\bore_out.txt"
              $BoreErr = "$env:TEMP\bore_err.txt"
              Start-Process -FilePath $BoreExe -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput $BoreOut -RedirectStandardError $BoreErr -WindowStyle Hidden

              for ($i = 1; $i -le 15; $i++) {
                  Start-Sleep -Seconds 2
                  $Combined = ""
                  if (Test-Path $BoreOut) { $Combined += Get-Content $BoreOut -Raw }
                  if (Test-Path $BoreErr) { $Combined += Get-Content $BoreErr -Raw }
                  if ($Combined -match "bore\.pub:\d+") {
                      $Address = $Matches[0]
                      break
                  }
              }

              if (-not $Address) {
                  Write-Host "Bore did not produce an address within timeout."
                  if (Test-Path $BoreOut) { Write-Host "--- bore stdout ---"; Get-Content $BoreOut | Write-Host }
                  if (Test-Path $BoreErr) { Write-Host "--- bore stderr ---"; Get-Content $BoreErr | Write-Host }
              }
          } catch {
              Write-Host "Primary tunnel (bore) failed: $($_.Exception.Message)"
          }

          if (-not $Address) {
              Write-Host "Attempting fallback tunnel via Pinggy..."

              $SshPath = (Get-Command ssh -ErrorAction SilentlyContinue).Source

              if (-not $SshPath) {
                  Write-Host "##[error] OpenSSH client (ssh.exe) not found on this runner."
              } else {
                  $PinggyOut = "$env:TEMP\pinggy_out.txt"
                  $PinggyErr = "$env:TEMP\pinggy_err.txt"

                  Start-Process -FilePath $SshPath -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:3389 free.pinggy.io" -RedirectStandardOutput $PinggyOut -RedirectStandardError $PinggyErr -WindowStyle Hidden

                  for ($i = 1; $i -le 20; $i++) {
                      Start-Sleep -Seconds 2
                      $Combined = ""
                      if (Test-Path $PinggyOut) { $Combined += Get-Content $PinggyOut -Raw }
                      if (Test-Path $PinggyErr) { $Combined += Get-Content $PinggyErr -Raw }
                      if ($Combined -match "[a-zA-Z0-9\.\-]+\.pinggy\.[a-z]+:\d+") {
                          $Address = $Matches[0]
                          break
                      }
                  }

                  if (-not $Address) {
                      Write-Host "Pinggy did not produce a recognizable address within timeout."
                      if (Test-Path $PinggyOut) { Write-Host "--- pinggy stdout ---"; Get-Content $PinggyOut | Write-Host }
                      if (Test-Path $PinggyErr) { Write-Host "--- pinggy stderr ---"; Get-Content $PinggyErr | Write-Host }
                  }
              }
          }

          if ($Address) {
              "RDP_ADDRESS=$Address" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Tunnel successfully established at: $Address"
          } else {
              Write-Host "##[error] Failed to establish any tunnel connection."
              exit 1
          }

      - name: Display Access Credentials and Maintain Session
        if: always()
        run: |
          Write-Host "=================================================="
          Write-Host "         SECURE RDP SESSION ESTABLISHED          "
          Write-Host "=================================================="
          Write-Host " RDP Address  : $env:RDP_ADDRESS"
          Write-Host " Username     : $env:RDP_USER"
          Write-Host " Password     : $env:RDP_PASS"
          Write-Host "=================================================="
          while ($true) {
              Start-Sleep -Seconds 3600
          }
